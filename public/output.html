<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirStudio — Program Output</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#070a14">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #wait {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; color: #5b688c; font-size: 14px; text-align: center; padding: 20px;
  }
  #wait b { color: #aab6dd; font-size: 17px; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="wait"><b>AirStudio Program Output</b><span id="waitSub">Waiting for a camera…</span></div>

  <script>
    'use strict';
    /* AirStudio clean program feed — for OBS Browser Source or fullscreen sharing.
       URL params: ?code=XXXXXX  ?fit=cover  ?audio=1 (unmute, for OBS)
                    ?cam=CAMERA_ID  ?camIndex=1  (view specific camera directly)
    */
    const params = new URLSearchParams(location.search);
    const ROOM = (params.get('code') || '').toUpperCase();
    const TARGET_CAM = params.get('cam') || '';
    const CAM_INDEX = parseInt(params.get('camIndex') || params.get('camindex') || '0', 10);
    const video = document.getElementById('v');
    video.muted = params.get('audio') !== '1';
    if (params.get('fit') === 'cover') video.style.objectFit = 'cover';
    if (!ROOM) document.getElementById('waitSub').textContent = 'Add ?code=YOURCODE (from the Studio) to this URL.';

const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' },
]};
  const camOrder = [];
  function trackPeer(id) {
    if (!camOrder.includes(id)) camOrder.push(id);
  }

  function showProgram() {
    if (TARGET_CAM) {
      const p = peers.get(TARGET_CAM);
      if (p?.stream) {
        if (video.srcObject !== p.stream) video.srcObject = p.stream;
        document.getElementById('wait').style.display = 'none';
        return;
      } else {
        video.srcObject = null;
        document.getElementById('wait').style.display = 'flex';
        document.getElementById('waitSub').textContent = 'Waiting for Camera...';
        return;
      }
    }
    if (CAM_INDEX > 0) {
      // Use join order
      const peerList = camOrder.length ? camOrder : [...peers.keys()];
      if (peerList.length >= CAM_INDEX) {
        const peerId = peerList[CAM_INDEX - 1];
        const p = peers.get(peerId);
        if (p?.stream) {
          if (video.srcObject !== p.stream) video.srcObject = p.stream;
          document.getElementById('wait').style.display = 'none';
          return;
        }
      }
      video.srcObject = null;
      document.getElementById('wait').style.display = 'flex';
      document.getElementById('waitSub').textContent = 'Waiting for Camera ' + CAM_INDEX + '...';
      return;
    }
    const p = peers.get(programId) || [...peers.values()][0];
    if (p?.stream) {
      if (video.srcObject !== p.stream) video.srcObject = p.stream;
      document.getElementById('wait').style.display = 'none';
    } else {
      video.srcObject = null;
      document.getElementById('wait').style.display = 'flex';
    }
  }

function connect() {
  if (!ROOM) return;
  // Same SIGNAL_URL logic as Studio/camera: static-only hosts advertise the
  // persistent WebSocket server via /api/config/public.
  fetch('/api/config/public').then(r => r.json()).then(cfg => {
    openSocket(cfg && cfg.signalUrl ? hostOf(cfg.signalUrl) : location.host);
  }).catch(() => openSocket(location.host));
}
function hostOf(u) { try { return new URL(u).host; } catch { return String(u).replace(/^wss?:\/\//, '').replace(/\/$/, ''); } }
function openSocket(host) {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${host}`);
  const relay = (to, kind, data) => ws.readyState === 1 && ws.send(JSON.stringify({ type: 'relay', to, kind, data }));
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', room: ROOM, role: 'output', name: 'Program Output' }));
  ws.onclose = () => setTimeout(connect, 2000);
    ws.onmessage = async ev => {
      const m = JSON.parse(ev.data);
      if (m.type === 'welcome') {
        // Create peer connections for cameras already in the room so output
        // can receive their video even if they joined before this page loaded.
        for (const p of (m.peers || [])) {
          if (p.role !== 'camera') continue;
          trackPeer(p.id);
          if (peers.has(p.id)) continue;
          const pc = new RTCPeerConnection(ICE);
          peers.set(p.id, { pc, stream: null });
          pc.onicecandidate = e => { if (e.candidate) relay(p.id, 'signal', { candidate: e.candidate }); };
          pc.ontrack = e => { peers.get(p.id).stream = e.streams[0] || new MediaStream([e.track]); showProgram(); };
        }
        showProgram();
      }
      if (m.type === 'peer-joined') {
        trackPeer(m.peer.id);
      }
      if (m.type === 'peer-left') {
        peers.get(m.id)?.pc.close(); peers.delete(m.id);
        if (programId === m.id) programId = null;
        showProgram();
        return;
      }
      if (m.type !== 'relay') return;
      if (m.kind === 'program') { programId = m.data.cameraId; showProgram(); return; }
      if (m.kind !== 'signal') return;

    let peer = peers.get(m.from);
    if (!peer) {
      trackPeer(m.from);
      const pc = new RTCPeerConnection(ICE);
      peer = { pc, stream: null };
      peers.set(m.from, peer);
      pc.onicecandidate = e => { if (e.candidate) relay(m.from, 'signal', { candidate: e.candidate }); };
      pc.ontrack = e => { peer.stream = e.streams[0] || new MediaStream([e.track]); showProgram(); };
    }
      try {
        if (m.data.sdp) {
          await peer.pc.setRemoteDescription(m.data.sdp);
          if (m.data.sdp.type === 'offer') {
            const ans = await peer.pc.createAnswer();
            await peer.pc.setLocalDescription(ans);
            relay(m.from, 'signal', { sdp: peer.pc.localDescription });
          }
        } else if (m.data.candidate) await peer.pc.addIceCandidate(m.data.candidate);
      } catch (e) { console.warn(e); }
    };
}
connect();
document.addEventListener('dblclick', () => {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
});
</script>
</body>
</html>
